name: incident-lab

services:
  target-service:
    image: ${TARGET_IMAGE:-incident/target-service:baseline}
    build:
      # 绝对路径：工作区 2026-11-04 起搬到仓库外（incident/lab-paths.json）。
      # 相对路径会按 compose 文件所在目录解析，搬完家就指到不存在的目录。
      context: /mnt/my-work/incident-lab/workspace/target-service
      args:
        # 制品自述：镜像自己说它是哪个 commit 构建的。
        # 这是台账里最硬的一档凭据（commit_source: oci-label）；
        # 没有它，「现在跑的是哪个 commit」只能按构建时刻猜。
        # incident/lab.sh 在调用 compose 之前把构建上下文的 git HEAD 导进来。
        GIT_COMMIT: '${GIT_COMMIT:-unknown}'
      labels:
        # 构建时刻。BuildKit 命中缓存时镜像 config 里的 created 是最早那一层
        # 的时间戳（实测停在两天前），所以台账的 built_at 必须来自镜像自己
        # 打的这个 label。用自己的命名空间：基础镜像已经带着
        # org.opencontainers.image.created，那个说的是基础镜像的构建时间。
        #
        # 换内容重建后 digest 变了，而 created 仍是第一次构建那个纳秒级不变的值
        # ——缓存残留，不是构建时刻。拿它当 built_at，台账里会出现一条比它自己
        # 那个 commit 还早的构建时间。
        io.incident-lab.build-time: '${BUILD_TIME:-unknown}'
    container_name: target-service
    ports:
      - '8080:8080'
    environment:
      # Everything in the lab is stamped in UTC. The read-only channels parse
      # log timestamps and git commit times into the same frame; without this
      # the container clock (UTC) and git (host-local) differ by the host offset
      # and deployment-window correlation silently breaks.
      TZ: UTC
      # Fault-injection knobs. Baseline values produce no fault.
      DB_POOL_SIZE: '${DB_POOL_SIZE:-10}'
      # Hikari's own default is 30s, spelled out here so the knob is settable
      # from the host. Pool exhaustion only surfaces as 5xx when this is
      # shorter than the queueing delay; at 30s requests just get slow.
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: '${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-30000}'
      DOWNSTREAM_TIMEOUT_MS: '${DOWNSTREAM_TIMEOUT_MS:-2000}'
      LOAD_ENABLED: '${LOAD_ENABLED:-true}'
      LOAD_PATHS: '${LOAD_PATHS:-/api/orders/1,/api/orders/2,/api/orders/3,/api/orders/4,/api/orders/5}'
    volumes:
      # The Agent greps this file; it is the only log source in the lab.
      - /mnt/my-work/incident-lab/workspace/logs:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: incident-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=6h'
    depends_on:
      target-service:
        condition: service_healthy
    restart: unless-stopped

  # 真实靶子通道（P2）专用的 Prometheus。
  #
  # 与上面那个 prometheus 分开，是有理由的，不是重复：
  #   · 真实靶子的体检实例**只绑宿主机的 127.0.0.1**（不绑 0.0.0.0，
  #     公司内网访问不到）。bridge 网络里的容器够不着宿主的回环地址，
  #     所以这个 Prometheus 必须用 host 网络命名空间。
  #   · 合成夹具那 4 轮有效证据依赖上面那个 :9090 上的历史数据。
  #     混在一起就等于动量具。真实通道单独一个实例，两边互不干扰。
  #
  # 监听 127.0.0.1:9094，同样不对外。配置在仓库外（含真实靶子的地址）。
  prometheus-real:
    image: prom/prometheus:v2.54.1
    container_name: incident-prometheus-real
    network_mode: host
    volumes:
      - /mnt/my-work/incident-lab/targets/p2/metrics/prometheus-host.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=127.0.0.1:9094'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: incident-alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
