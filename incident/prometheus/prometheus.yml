global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: target-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["target-service:8080"]
        labels:
          service: target-service